openapi: 3.2.0
info:
  title: Flyte Admin Version API
  description: The Flyte Admin API is the control-plane REST API exposed by the flyteadmin service.
  version: v1
  contact:
    name: Flyte
    url: https://flyte.org
  license:
    name: Apache 2.0
    url: https://www.apache.org/licenses/LICENSE-2.0
servers:
- url: http://localhost:30080
  description: Default flyteadmin endpoint in a local sandbox cluster
tags:
- name: Version
  description: Admin server version information.
paths:
  /api/v1/version:
    get:
      tags:
      - Version
      summary: Retrieve flyteadmin version
      operationId: GetVersion
      responses:
        '200':
          description: Server version information.
