openapi: 3.2.0
info:
  title: Flyte Admin Projects API
  description: The Flyte Admin API is the control-plane REST API exposed by the flyteadmin service.
  version: v1
  contact:
    name: Flyte
    url: https://flyte.org
  license:
    name: Apache 2.0
    url: https://www.apache.org/licenses/LICENSE-2.0
servers:
- url: http://localhost:30080
  description: Default flyteadmin endpoint in a local sandbox cluster
tags:
- name: Projects
  description: Project registration and listing.
paths:
  /api/v1/projects:
    get:
      tags:
      - Projects
      summary: List projects
      operationId: ListProjects
      responses:
        '200':
          description: A list of registered projects.
    post:
      tags:
      - Projects
      summary: Register a project
      operationId: RegisterProject
      responses:
        '200':
          description: Project registered.
  /api/v1/projects/{id}:
    put:
      tags:
      - Projects
      summary: Update a project
      operationId: UpdateProject
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Project updated.
