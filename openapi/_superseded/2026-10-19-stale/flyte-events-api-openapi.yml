openapi: 3.2.0
info:
  title: Flyte Admin Events API
  description: The Flyte Admin API is the control-plane REST API exposed by the flyteadmin service.
  version: v1
  contact:
    name: Flyte
    url: https://flyte.org
  license:
    name: Apache 2.0
    url: https://www.apache.org/licenses/LICENSE-2.0
servers:
- url: http://localhost:30080
  description: Default flyteadmin endpoint in a local sandbox cluster
tags:
- name: Events
  description: Workflow, node, and task execution events.
paths:
  /api/v1/events/workflows:
    post:
      tags:
      - Events
      summary: Submit a workflow execution event
      operationId: CreateWorkflowEvent
      responses:
        '200':
          description: Event accepted.
  /api/v1/events/nodes:
    post:
      tags:
      - Events
      summary: Submit a node execution event
      operationId: CreateNodeEvent
      responses:
        '200':
          description: Event accepted.
  /api/v1/events/tasks:
    post:
      tags:
      - Events
      summary: Submit a task execution event
      operationId: CreateTaskEvent
      responses:
        '200':
          description: Event accepted.
