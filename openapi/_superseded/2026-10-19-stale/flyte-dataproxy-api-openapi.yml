openapi: 3.2.0
info:
  title: Flyte Admin Data Proxy API
  description: The Flyte Admin API is the control-plane REST API exposed by the flyteadmin service.
  version: v1
  contact:
    name: Flyte
    url: https://flyte.org
  license:
    name: Apache 2.0
    url: https://www.apache.org/licenses/LICENSE-2.0
servers:
- url: http://localhost:30080
  description: Default flyteadmin endpoint in a local sandbox cluster
tags:
- name: DataProxy
  description: Signed URL retrieval for execution data inputs and outputs.
paths:
  /api/v1/data/executions/{id.project}/{id.domain}/{id.name}:
    get:
      tags:
      - DataProxy
      summary: Retrieve signed data URLs for a workflow execution
      operationId: GetExecutionData
      parameters:
      - name: id.project
        in: path
        required: true
        schema:
          type: string
      - name: id.domain
        in: path
        required: true
        schema:
          type: string
      - name: id.name
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Execution data URLs.
