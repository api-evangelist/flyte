openapi: 3.2.0
info:
  title: Flyte Admin Tasks API
  description: The Flyte Admin API is the control-plane REST API exposed by the flyteadmin service.
  version: v1
  contact:
    name: Flyte
    url: https://flyte.org
  license:
    name: Apache 2.0
    url: https://www.apache.org/licenses/LICENSE-2.0
servers:
- url: http://localhost:30080
  description: Default flyteadmin endpoint in a local sandbox cluster
tags:
- name: Tasks
  description: Task entity registration, listing, and retrieval.
paths:
  /api/v1/tasks:
    post:
      tags:
      - Tasks
      summary: Register a task
      operationId: CreateTask
      responses:
        '200':
          description: Task registered.
  /api/v1/tasks/{id.project}/{id.domain}:
    get:
      tags:
      - Tasks
      summary: List tasks
      operationId: ListTasks
      parameters:
      - name: id.project
        in: path
        required: true
        schema:
          type: string
      - name: id.domain
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: A list of tasks.
  /api/v1/tasks/{id.project}/{id.domain}/{id.name}:
    get:
      tags:
      - Tasks
      summary: List tasks for a name
      operationId: ListTasksByName
      parameters:
      - name: id.project
        in: path
        required: true
        schema:
          type: string
      - name: id.domain
        in: path
        required: true
        schema:
          type: string
      - name: id.name
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: A list of tasks.
  /api/v1/tasks/{id.project}/{id.domain}/{id.name}/{id.version}:
    get:
      tags:
      - Tasks
      summary: Retrieve a task
      operationId: GetTask
      parameters:
      - name: id.project
        in: path
        required: true
        schema:
          type: string
      - name: id.domain
        in: path
        required: true
        schema:
          type: string
      - name: id.name
        in: path
        required: true
        schema:
          type: string
      - name: id.version
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: A task entity.
  /api/v1/task_ids/{project}/{domain}:
    get:
      tags:
      - Tasks
      summary: List task identifiers
      operationId: ListTaskIds
      parameters:
      - name: project
        in: path
        required: true
        schema:
          type: string
      - name: domain
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: A list of task identifiers.
